<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
  <style>
    body{margin:0;background:#fff;font-family:Inter,system-ui,sans-serif;color:#0F1115;-webkit-font-smoothing:antialiased}
    a{color:#2563EB}a:hover{color:#1D4ED8}
    .eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8A909B}
    .h{font-family:'Inter Tight',Inter,sans-serif;font-weight:500;letter-spacing:-.04em;line-height:1.14;font-size:36px;margin:16px 0 0;max-width:22ch}
    .h em{font-style:normal;color:#2563EB}
    .h span{color:#5B6270}
    .cap{color:#8A909B;font-size:13px;margin:0}
    .lg{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#5B6270}
    .sw{width:12px;height:12px;border-radius:4px;display:block}
  </style>
</helmet>

<div style="padding:44px 48px 40px; display:flex; flex-direction:column; gap:38px">
  <div>
    <div class="eyebrow">L'idée</div>
    <p class="h">Le temps ne part pas d'un coup. <span>Il part par tranches de dix minutes.</span></p>
  </div>

  <div style="display:flex; flex-direction:column; gap:0">
    <div style="position:relative; height:66px; border-radius:12px; background:#F7F8FA; overflow:hidden">
      <div style="position:absolute;left:2%;top:12px;width:5%;height:42px;border-radius:6px;background:#2563EB"></div>
      <div style="position:absolute;left:11%;top:12px;width:3%;height:42px;border-radius:6px;background:#2563EB"></div>
      <div style="position:absolute;left:19%;top:12px;width:6%;height:42px;border-radius:6px;background:#2563EB"></div>
      <div style="position:absolute;left:31%;top:12px;width:2.5%;height:42px;border-radius:6px;background:#2563EB"></div>
      <div style="position:absolute;left:37%;top:12px;width:4%;height:42px;border-radius:6px;background:#2563EB"></div>
      <div style="position:absolute;left:47%;top:12px;width:3%;height:42px;border-radius:6px;background:#2563EB"></div>
      <div style="position:absolute;left:55%;top:12px;width:5.5%;height:42px;border-radius:6px;background:#2563EB"></div>
      <div style="position:absolute;left:66%;top:12px;width:2.5%;height:42px;border-radius:6px;background:#2563EB"></div>
      <div style="position:absolute;left:73%;top:12px;width:4.5%;height:42px;border-radius:6px;background:#2563EB"></div>
      <div style="position:absolute;left:83%;top:12px;width:3%;height:42px;border-radius:6px;background:#2563EB"></div>
      <div style="position:absolute;left:90%;top:12px;width:6%;height:42px;border-radius:6px;background:#2563EB"></div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(11,minmax(0,1fr));margin-top:12px">
      <div style="font-size:11.5px;color:#B4B9C2">8h</div><div style="font-size:11.5px;color:#B4B9C2">9h</div>
      <div style="font-size:11.5px;color:#B4B9C2">10h</div><div style="font-size:11.5px;color:#B4B9C2">11h</div>
      <div style="font-size:11.5px;color:#B4B9C2">12h</div><div style="font-size:11.5px;color:#B4B9C2">13h</div>
      <div style="font-size:11.5px;color:#B4B9C2">14h</div><div style="font-size:11.5px;color:#B4B9C2">15h</div>
      <div style="font-size:11.5px;color:#B4B9C2">16h</div><div style="font-size:11.5px;color:#B4B9C2">17h</div>
      <div style="font-size:11.5px;color:#B4B9C2">18h</div>
    </div>
  </div>

  <div style="display:flex;gap:30px;flex-wrap:wrap">
    <div class="lg"><span class="sw" style="background:#2563EB"></span>Une interruption répétitive</div>
    <div class="lg"><span class="sw" style="background:#F7F8FA;border:1px solid #EBECEF"></span>Le travail continu</div>
  </div>

  <p class="cap">Aucune de ces tranches ne coûte assez cher pour qu'on s'en occupe. Toutes ensemble, elles font une journée par semaine.</p>
</div>
</x-dc>
</body>
</html>
