<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">
  <style>
    body{margin:0;background:#fff;font-family:Inter,system-ui,sans-serif;color:#0F1115;-webkit-font-smoothing:antialiased}
    a{color:#2563EB}a:hover{color:#1D4ED8}
    .eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#8A909B}
    .h{font-family:'Inter Tight',Inter,sans-serif;font-weight:500;letter-spacing:-.04em;line-height:1.14;font-size:36px;margin:16px 0 0;max-width:22ch}
    .h em{font-style:normal;color:#2563EB}
    .h span{color:#5B6270}
    .cap{color:#8A909B;font-size:13px;margin:0}
    .lg{display:flex;align-items:center;gap:10px;font-size:13.5px;color:#5B6270}
    .sw{width:12px;height:12px;border-radius:4px;display:block}
  </style>
</helmet>

<div style="padding:44px 48px 40px; display:flex; flex-direction:column; gap:34px">
  <div>
    <div class="eyebrow">L'idée</div>
    <p class="h">La même semaine, <em>avant et après</em>. <span>La différence, c'est ce qu'on vous rend.</span></p>
  </div>

  <div style="display:grid; grid-template-columns:1fr 96px 1fr; align-items:end; gap:0">
    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-size:13px;font-weight:600;color:#5B6270">Aujourd'hui</div>
      <div style="display:flex;flex-direction:column;border-radius:12px;overflow:hidden;height:250px;gap:2px">
        <div style="flex:16;background:#2563EB;display:flex;align-items:center;padding:0 16px;color:#fff;font-size:14px;font-weight:600">Travail répétitif</div>
        <div style="flex:24;background:#F1F2F4;display:flex;align-items:center;padding:0 16px;font-size:14px;font-weight:600;color:#5B6270">Votre métier</div>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:104px">
      <svg width="52" height="16" viewBox="0 0 52 16" fill="none" stroke="#2563EB" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 8h46"/><path d="M42 3l6 5-6 5"/>
      </svg>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <div style="font-size:13px;font-weight:600;color:#2563EB">Après un premier chantier</div>
      <div style="display:flex;flex-direction:column;border-radius:12px;overflow:hidden;height:250px;gap:2px">
        <div style="flex:5;background:#2563EB;display:flex;align-items:center;padding:0 16px;color:#fff;font-size:14px;font-weight:600">Ce qui reste</div>
        <div style="flex:11;background:repeating-linear-gradient(135deg,#EFF5FF,#EFF5FF 7px,#fff 7px,#fff 14px);border:1px dashed #BFD5FB;display:flex;align-items:center;padding:0 16px;font-size:14px;font-weight:600;color:#2563EB">Rendu à votre équipe</div>
        <div style="flex:24;background:#F1F2F4;display:flex;align-items:center;padding:0 16px;font-size:14px;font-weight:600;color:#5B6270">Votre métier</div>
      </div>
    </div>
  </div>

  <p class="cap">Proportions données en exemple. La vôtre se mesure pendant la première visite.</p>
</div>
</x-dc>
</body>
</html>
